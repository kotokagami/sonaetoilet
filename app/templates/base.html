<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SONAE{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500;600;700&family=Figtree:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
</head>
<body>
{% block body %}
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">
      <span class="brand-mark">▣◉</span><strong>SONAE</strong><small>暮らしを、止めない。</small>
    </a>
    <form action="/logout" method="post"><button class="btn btn-ghost-light" type="submit">ログアウト</button></form>
  </div>
</header>
<div class="accent-line"></div>
<main class="page-shell">{% block content %}{% endblock %}</main>
<footer class="footer"><span><strong>SONAE</strong> 暮らしを、止めない。</span><span>災害時排水切替システム</span></footer>
<script src="{{ url_for('static', path='js/app.js') }}" defer></script>
{% endblock %}
</body>
</html>
