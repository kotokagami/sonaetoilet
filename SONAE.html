// ── helpers ───────────────────────────────────────────────
const activeB  = bl => bl.find(b=>b.st==="active")||null;
const standbyB = bl => bl.filter(b=>b.st==="standby");
const fullB    = bl => bl.filter(b=>b.st==="full");
const spareCap = bl => standbyB(bl).reduce((s,b)=>s+b.cap,0);
const pct      = b  => b ? Math.round((b.fill/b.cap)*100) : 0;
function daysLeft(bl,pop,rate){ const a=activeB(bl); if(!a||!pop||!rate) return null; const d=(a.cap-a.fill)/(pop*rate); return d<1?-1:parseFloat(d.toFixed(1)); }
function alertLvl(bl,pop,rate){ const p=pct(activeB(bl)); const d=daysLeft(bl,pop,rate); if(p>=90||d===-1) return 2; if(p>=70||d!==null&&d<2) return 1; return 0; }
function pinColor(site){ const s=standbyB(site.bladders); if(site.mode!=="disaster") return C.gray; if(s.length===0) return C.warn90; if(s.length===1) return C.warn70; return C.success; }
function nowStr(){ const n=new Date(); return `${n.getMonth()+1}/${n.getDate()} ${String(n.getHours()).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}`; }
function recommend(tot){ const s=BSIZES.find(x=>x>=tot); if(s) return [{size:s,count:1,surplus:s-tot}]; const r=[];let rem=tot; for(let i=BSIZES.length-1;i>=0&&rem>0;i--){const n=Math.floor(rem/BSIZES[i]);if(n>0){r.push({size:BSIZES[i],count:n,surplus:0});rem-=n*BSIZES[i];}} if(rem>0){const t=BSIZES.find(x=>x>=rem)||BSIZES[BSIZES.length-1];r.push({size:t,count:1,surplus:t-rem});} return r; }

// ── tiny components ───────────────────────────────────────
const F = "DM Sans,sans-serif";
const FF= "Figtree,sans-serif";
const FM= "DM Mono,monospace";
function Logo({size=32,light=false}){const s=light?C.white:C.primaryBlue;return(<svg width={size} height={size*.72} viewBox="0 0 50 36" fill="none"><rect x="1" y="6" width="18" height="18" rx="2" stroke={s} strokeWidth="2.2" fill="none"/><line x1="10" y1="1" x2="10" y2="6" stroke={s} strokeWidth="2.2"/><line x1="10" y1="24" x2="10" y2="30" stroke={C.lightBlue} strokeWidth="2.2"/><line x1="19" y1="15" x2="28" y2="15" stroke={s} strokeWidth="2.2"/><rect x="28" y="4" width="21" height="21" rx="2" stroke={s} strokeWidth="2.2" fill="none"/><circle cx="38.5" cy="14.5" r="6" stroke={C.lightBlue} strokeWidth="2"/><circle cx="38.5" cy="14.5" r="2.5" fill={s}/></svg>);}
function Card({ch,style={}}){return <div style={{background:C.white,border:`1px solid ${C.border}`,borderRadius:10,padding:18,...style}}>{ch}</div>;}
function Lbl({t}){return <div style={{fontSize:11,fontFamily:F,fontWeight:700,color:C.gray,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>{t}</div>;}
function FillBar({p,h=10,marks=false}){const col=p>=90?C.warn90:p>=70?C.warn70:C.primaryBlue;return(<div style={{position:"relative"}}><div style={{height:h,background:C.paleBlue,borderRadius:h/2,overflow:"hidden"}}><div style={{width:`${p}%`,height:"100%",background:col,borderRadius:h/2,transition:"width .5s"}}/></div>{marks&&[70,90].map(x=><div key={x} style={{position:"absolute",left:`${x}%`,top:-2,bottom:-2,width:2,background:`${x===70?C.warn70:C.warn90}99`,borderRadius:1,pointerEvents:"none"}}><div style={{position:"absolute",top:-14,left:-6,fontSize:9,fontFamily:FM,color:x===70?C.warn70:C.warn90}}>{x}%</div></div>)}</div>);}
function Modal({ch,onClose}){return(<div style={{position:"fixed",inset:0,background:"rgba(14,23,42,.6)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={onClose}><div style={{background:C.white,borderRadius:14,padding:"26px 22px",width:"100%",maxWidth:400,boxShadow:"0 20px 60px rgba(0,0,0,.3)"}} onClick={e=>e.stopPropagation()}>{ch}</div></div>);}
function Btn({label,onClick,col=C.primaryBlue,outline=false,small=false,full=false,disabled=false}){return(<button onClick={!disabled?onClick:undefined} style={{padding:small?"6px 14px":"10px 18px",borderRadius:9,border:outline?`2px solid ${col}`:"none",background:disabled?"#D1D5DB":outline?"transparent":col,color:outline?col:C.white,fontFamily:F,fontWeight:700,fontSize:small?12:13,cursor:disabled?"not-allowed":"pointer",width:full?"100%":"auto",opacity:disabled?.7:1}}>{label}</button>);}
function TopBar({right,onLogo}){return(<><div style={{background:C.deepBlue,padding:"0 24px",position:"sticky",top:0,zIndex:100}}><div style={{maxWidth:960,margin:"0 auto",height:52,display:"flex",alignItems:"center",justifyContent:"space-between"}}><div style={{display:"flex",alignItems:"center",gap:10,cursor:onLogo?"pointer":"default"}} onClick={onLogo}><Logo size={24} light/><span style={{fontFamily:FF,fontWeight:800,fontSize:15,color:C.white,letterSpacing:4}}>SONAE</span><span style={{fontSize:10,color:C.lightBlue,letterSpacing:1,fontFamily:F}}>暮らしを、止めない。</span></div>{right}</div></div><div style={{height:3,background:`linear-gradient(90deg,${C.primaryBlue},${C.lightBlue})`,position:"sticky",top:52,zIndex:100}}/></>);}
function BackBtn({onClick,label="戻る"}){return(<button onClick={onClick} style={{background:"none",border:`1px solid ${C.paleBlue}`,color:C.primaryBlue,cursor:"pointer",fontSize:12,fontFamily:F,padding:"5px 12px",borderRadius:8,display:"flex",alignItems:"center",gap:5}}>← {label}</button>);}
function Footer({onLogout}){return(<div style={{marginTop:36,paddingTop:18,borderTop:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={{display:"flex",alignItems:"center",gap:8}}><Logo size={16}/><span style={{fontFamily:FF,fontWeight:800,fontSize:11,color:C.deepBlue,letterSpacing:3}}>SONAE</span><span style={{fontSize:11,fontFamily:F,color:C.gray}}>暮らしを、止めない。</span></div><button onClick={onLogout} style={{background:"none",border:`1px solid ${C.border}`,color:C.gray,cursor:"pointer",fontSize:11,fontFamily:F,padding:"4px 12px",borderRadius:6}}>ログアウト</button></div>);}
function RateBar({val,set}){return(<div style={{display:"flex",gap:6}}>{RATES.map(r=><button key={r.v} onClick={()=>set(r.v)} style={{flex:1,padding:"9px 6px",borderRadius:8,border:`2px solid ${val===r.v?r.col:C.border}`,background:val===r.v?r.col+"18":C.white,cursor:"pointer",textAlign:"center"}}><div style={{fontFamily:FF,fontWeight:800,fontSize:16,color:val===r.v?r.col:C.deepBlue}}>{r.l}</div><div style={{fontSize:9,fontFamily:F,color:C.gray,marginTop:1,lineHeight:1.2}}>{r.sub}</div></button>)}</div>);}

// ── SysToggles ────────────────────────────────────────────
function SysToggles({sys,onToggle}){
  const items=[
    {k:"blocked",on:sys.blocked,lbl:"排水管",  on_l:"閉塞済",  off_l:"未閉塞"},
    {k:"gen",    on:sys.gen,    lbl:"発電機",   on_l:"稼働中",  off_l:"停止中"},
    {k:"pump",   on:sys.pump,   lbl:"ポンプ",   on_l:"作動中",  off_l:"未接続"},
    {k:"sewer",  on:sys.sewer,  lbl:"下水本管", on_l:"復旧済",  off_l:"使用不可"},
  ];
  return(<>
    <Lbl t="システム状態（タップで更新）"/>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
      {items.map(x=>(
        <button key={x.k} onClick={()=>onToggle(x.k)} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",background:x.on?"#D1FAE533":"#F3F4F6",borderRadius:8,border:`2px solid ${x.on?"#10B98166":C.border}`,cursor:"pointer",textAlign:"left"}}>
          <div style={{width:12,height:12,borderRadius:"50%",background:x.on?C.success:"#D1D5DB",border:`2px solid ${x.on?C.success:"#9CA3AF"}`,flexShrink:0}}/>
          <div><div style={{fontSize:11,fontFamily:F,color:C.gray}}>{x.lbl}</div><div style={{fontSize:12,fontFamily:F,fontWeight:700,color:x.on?C.success:C.gray}}>{x.on?x.on_l:x.off_l}</div></div>
        </button>
      ))}
    </div>
    {sys.sewer&&<div style={{marginTop:8,padding:"7px 12px",background:"#D1FAE533",borderRadius:8,fontSize:12,fontFamily:F,color:C.success,fontWeight:600}}>✓ 下水本管復旧 — 本管への圧送が可能</div>}
  </>);
}

// ── StockPanel ────────────────────────────────────────────
function StockPanel({bladders,sewerOk,onSwitch,onDispose,onUndo,onAdd}){
  const a=activeB(bladders); const sb=standbyB(bladders); const fb=fullB(bladders);
  const p=pct(a);
  const grp={}; sb.forEach(b=>{grp[b.cap]=(grp[b.cap]||0)+1;});
  return(<div>
    {/* Active */}
    {a&&<div style={{marginBottom:16,padding:16,background:p>=90?"#FEF2F2":p>=70?"#FFFBEB":C.paleBlue,borderRadius:10,border:`2px solid ${p>=90?C.warn90:p>=70?C.warn70:C.primaryBlue}`}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
        <div><div style={{fontSize:11,fontFamily:F,color:C.gray}}>使用中 — {a.id}</div><div style={{fontFamily:FF,fontWeight:800,fontSize:30,color:p>=90?C.warn90:p>=70?C.warn70:C.primaryBlue,lineHeight:1}}>{p}%</div><div style={{fontSize:12,fontFamily:F,color:C.gray,marginTop:3}}>{a.fill.toLocaleString()}L / {a.cap.toLocaleString()}L</div></div>
      </div>
      <FillBar p={p} h={12} marks={true}/>
      <div style={{fontSize:11,fontFamily:F,color:C.gray,marginTop:6,marginBottom:12}}>70% <span style={{color:C.warn70}}>注意</span> · 90% <span style={{color:C.warn90}}>警告</span></div>
      <button onClick={onSwitch} disabled={sb.length===0} style={{width:"100%",padding:"10px 0",borderRadius:9,border:`2px solid ${sb.length>0?C.primaryBlue:"#D1D5DB"}`,background:sb.length>0?C.paleBlue:"#F3F4F6",color:sb.length>0?C.primaryBlue:C.gray,fontFamily:F,fontWeight:700,fontSize:13,cursor:sb.length>0?"pointer":"not-allowed"}}>
        🔁 ブラダーを切替{sb.length===0?" — 待機中なし":""}
      </button>
    </div>}
    {/* Standby */}
    {sb.length>0&&<div style={{marginBottom:12,padding:"12px 14px",background:C.white,border:`1px solid ${C.border}`,borderRadius:10}}>
      <div style={{fontSize:11,fontFamily:F,color:C.gray,fontWeight:700,marginBottom:8}}>待機中</div>
      {Object.entries(grp).sort((a,b)=>b[0]-a[0]).map(([cap,n])=><div key={cap} style={{display:"flex",justifyContent:"space-between",fontSize:13,fontFamily:F,color:C.deepBlue,marginBottom:4}}><span>{n}基 × {parseInt(cap).toLocaleString()}L</span><span style={{fontWeight:600}}>{(n*parseInt(cap)).toLocaleString()}L</span></div>)}
      <div style={{display:"flex",justifyContent:"space-between",borderTop:`1px dashed ${C.border}`,marginTop:8,paddingTop:8,fontSize:12,fontFamily:F}}><span style={{color:C.gray}}>待機合計</span><span style={{color:C.success,fontWeight:700}}>{sb.reduce((s,b)=>s+b.cap,0).toLocaleString()}L</span></div>
    </div>}
    {sb.length===0&&!a&&<div style={{padding:"12px 14px",background:"#FEF2F2",border:`1px solid ${C.warn90}`,borderRadius:10,fontSize:13,fontFamily:F,color:C.warn90,fontWeight:700,marginBottom:12}}>⛔ ブラダー在庫なし</div>}
    {/* Full */}
    {fb.length>0&&<div style={{marginBottom:12}}>
      <div style={{fontSize:11,fontFamily:F,color:C.warn90,fontWeight:700,marginBottom:8}}>満杯（回収待ち）</div>
      {fb.map(b=><div key={b.id} style={{padding:"10px 14px",background:"#FEF2F2",borderRadius:10,border:`1px solid ${C.warn90}44`,marginBottom:8}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <span style={{fontSize:13,fontFamily:F,fontWeight:700,color:C.warn90}}>{b.id} — {b.cap.toLocaleString()}L</span>
          {b.disposal?<span style={{fontSize:10,fontFamily:F,color:C.success,fontWeight:700,background:"#D1FAE5",padding:"2px 8px",borderRadius:10}}>✓ 処分済</span>:<span style={{fontSize:10,fontFamily:F,color:C.warn90,fontWeight:700}}>未処分</span>}
        </div>
        {b.disposal
          ?<div><div style={{fontSize:11,fontFamily:F,color:C.gray}}>{b.disposal.method} · {b.disposal.time}{b.disposal.note?` · ${b.disposal.note}`:""}</div><button onClick={()=>onUndo(b.id)} style={{marginTop:4,padding:"3px 10px",borderRadius:6,border:`1px solid ${C.border}`,background:"none",color:C.gray,fontFamily:F,fontSize:11,cursor:"pointer"}}>取り消し</button></div>
          :<button onClick={()=>onDispose(b.id)} style={{width:"100%",padding:"7px 0",borderRadius:7,border:`1px solid ${C.warn90}`,background:"transparent",color:C.warn90,fontFamily:F,fontWeight:700,fontSize:12,cursor:"pointer"}}>処分方法を記録する</button>
        }
      </div>)}
    </div>}
    {/* Add */}
    <button onClick={onAdd} style={{display:"block",width:"100%",padding:"10px 0",borderRadius:8,border:`2px dashed ${C.success}`,background:"#D1FAE522",color:C.success,fontFamily:F,fontWeight:700,fontSize:13,cursor:"pointer"}}>+ ブラダーを在庫に追加</button>
  </div>);
}

// ── Modals ────────────────────────────────────────────────
function SwitchModal({active,standby,onConfirm,onClose}){
  const [chosen,setChosen]=useState(standby[0]?.id||"");
  return(<Modal ch={<div>
    <div style={{textAlign:"center",fontSize:22,marginBottom:8}}>🔁</div>

// ── BUILDING VIEW ─────────────────────────────────────────
function BuildingView({site,onLogout}){
  const [rate,setRate]=useState(site.rate);
  const [tab,setTab]=useState("status");
  const [bladders,setBladders]=useState(site.bladders.map(b=>({...b,disposal:null})));
  const [sys,setSys]=useState({...site.sys});
  const [transfers,setTransfers]=useState(INIT_TRANSFERS.filter(t=>t.from===site.id||t.to===site.id));
  const [showTForm,setShowTForm]=useState(false);
  const [manSec,setManSec]=useState(null);

  function toggleSys(k){setSys(p=>({...p,[k]:!p[k]}));}
  function doSwitch(nextId){setBladders(p=>{const n=[...p];const ai=n.findIndex(b=>b.st==="active");const si=n.findIndex(b=>b.id===nextId);if(ai>=0)n[ai]={...n[ai],st:"full",fill:n[ai].cap};if(si>=0)n[si]={...n[si],st:"active"};return n;});}
  function doDispose(id,method,note){setBladders(p=>p.map(b=>b.id===id?{...b,disposal:{method,time:nowStr(),note}}:b));}
  function undoDispose(id){setBladders(p=>p.map(b=>b.id===id?{...b,disposal:null}:b));}
  function addBladder(cap,label){setBladders(p=>[...p,{id:label,cap,fill:0,st:"standby",disposal:null}]);}

  const isD=site.mode==="disaster";
  const lvl=alertLvl(bladders,site.pop,rate);

  const TABS=[["status","状態・在庫"],["transfers","移送"],["vacuum","バキューム車"],["manual","マニュアル"]];
  return(<div style={{minHeight:"100vh",background:C.offWhite}}>
    <TopBar onLogo={onLogout} right={<span style={{fontSize:11,fontFamily:F,fontWeight:700,padding:"3px 12px",borderRadius:20,background:isD?"#FEE2E2":"#D1FAE5",color:isD?C.warn90:C.success}}>{isD?"⚠ 災害対応中":"✓ 通常"}</span>}/>
    <div style={{maxWidth:680,margin:"0 auto",padding:"24px 20px"}}>
      <h1 style={{margin:"0 0 4px",fontFamily:FF,fontWeight:800,fontSize:22,color:C.deepBlue}}>{site.name}</h1>

      {isD&&lvl===2&&<div style={{background:"#FEF2F2",border:`2px solid ${C.warn90}`,borderLeft:`5px solid ${C.warn90}`,borderRadius:10,padding:"12px 16px",marginBottom:16}}><div style={{fontFamily:FF,fontWeight:700,fontSize:14,color:C.warn90,marginBottom:8}}>⛔ 使用中ブラダー残り1日未満 — 至急対応が必要</div><div style={{display:"flex",gap:8}}><Btn label="🚛 バキューム車" onClick={()=>setTab("vacuum")} col={C.warn90} small/><Btn label="🔄 移送を申請" onClick={()=>setTab("transfers")} col={C.warn90} outline small/></div></div>}
      {isD&&lvl===1&&<div style={{background:"#FFFBEB",border:`2px solid ${C.warn70}`,borderLeft:`5px solid ${C.warn70}`,borderRadius:10,padding:"10px 16px",marginBottom:16,fontSize:12,fontFamily:F,color:"#92400E",fontWeight:700}}>⚠️ 使用中ブラダー {pct(activeB(bladders))}% — バキューム車予約・次ブラダー準備を推奨</div>}

        {!showTForm&&<TransferList transfers={transfers} sites={SITES_INIT} isCity={false}/>}
      </>}

      {tab==="manual"&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>{MANUAL.map(s=><div key={s.id} onClick={()=>setManSec(s)} style={{background:C.white,border:`1px solid ${C.border}`,borderTop:`3px solid ${C.primaryBlue}`,borderRadius:10,padding:18,cursor:"pointer"}} onMouseEnter={e=>{e.currentTarget.style.boxShadow="0 4px 16px rgba(29,78,216,.1)";}} onMouseLeave={e=>{e.currentTarget.style.boxShadow="none";}}><div style={{fontSize:24,marginBottom:8}}>{s.icon}</div><div style={{fontFamily:FF,fontWeight:700,fontSize:14,color:C.deepBlue,marginBottom:2}}>{s.title}</div><div style={{fontSize:11,fontFamily:F,color:C.gray}}>{s.steps.length}ステップ →</div></div>)}</div>}

// ── Transfer components ───────────────────────────────────
function TransferForm({sites,myId,onSubmit,onCancel}){
  const [from,setFrom]=useState("");
  const [to,setTo]=useState(myId?String(myId):"");
  const [size,setSize]=useState("");
  const [count,setCount]=useState(1);
  const [note,setNote]=useState("");
  const donors=sites.filter(s=>standbyB(s.bladders).length>0&&s.id!==parseInt(to));
  const donorSite=sites.find(s=>s.id===parseInt(from));
  const stockedSizes=donorSite?[...new Set(standbyB(donorSite.bladders).map(b=>b.cap))].sort((a,b)=>a-b):[];

              <button key={cap} onClick={()=>setSize(String(cap))} style={{padding:"9px 16px",borderRadius:8,border:`2px solid ${size===String(cap)?C.primaryBlue:C.border}`,background:size===String(cap)?C.paleBlue:C.white,cursor:"pointer",textAlign:"center"}}>

                <div style={{fontSize:10,fontFamily:F,color:C.gray,marginTop:2}}>{sizeCount(cap)}基 在庫</div>

        <div>
          <div style={{fontSize:11,fontFamily:F,color:C.gray,marginBottom:5}}>基数</div>
          <input type="number" min="1" max={size?sizeCount(parseInt(size)):99} value={count} onChange={e=>setCount(e.target.value)} style={{width:"100%",border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 10px",fontSize:13,fontFamily:F,color:C.deepBlue,background:C.offWhite,outline:"none",boxSizing:"border-box"}}/>
          {size&&<div style={{fontSize:10,fontFamily:F,color:C.gray,marginTop:3}}>最大 {sizeCount(parseInt(size))}基</div>}

        </div>
      </div>
      <div style={{display:"flex",gap:10}}>
        <Btn label="申請する" onClick={()=>ok&&onSubmit({from:parseInt(from),to:parseInt(to),size:parseInt(size),count:parseInt(count),note})} disabled={!ok} full/>
        <Btn label="キャンセル" onClick={onCancel} outline col={C.gray}/>
      </div>
    </div>
  );
}

function VacuumPanel(){return(<div>{VACUUMS.map(t=><div key={t.id} style={{background:C.white,border:`1px solid ${C.border}`,borderRadius:10,padding:16,marginBottom:12}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}><div><div style={{fontFamily:FF,fontWeight:700,fontSize:13,color:C.deepBlue}}>{t.co}</div><div style={{fontSize:11,fontFamily:F,color:C.gray,marginTop:2}}>エリア：{t.area} · 目安：{t.res}</div></div><div style={{textAlign:"right"}}>{t.contract&&<div style={{fontSize:10,fontFamily:F,color:C.success,fontWeight:700}}>✓ 契約済</div>}<div style={{fontSize:10,fontFamily:F,fontWeight:700,padding:"2px 8px",borderRadius:12,background:t.ok?"#D1FAE5":"#FEE2E2",color:t.ok?C.success:C.warn90,marginTop:4}}>{t.ok?"稼働可":"対応中"}</div></div></div><a href={`tel:${t.ph}`} style={{display:"inline-flex",alignItems:"center",gap:6,background:C.paleBlue,color:C.primaryBlue,border:`1px solid ${C.primaryBlue}44`,borderRadius:8,padding:"6px 14px",fontSize:13,fontFamily:F,fontWeight:700,textDecoration:"none"}}>📞 {t.ph}</a></div>)}</div>);}

// ── Recommender ───────────────────────────────────────────
function Recommender(){
  const [pop,setPop]=useState(""); const [days,setDays]=useState(3); const [rate,setRate]=useState(20);
  const tot=pop&&!isNaN(pop)?Math.ceil(parseInt(pop)*rate*days):null;
  const cfg=tot?recommend(tot):null;
  return(<div><Card style={{marginBottom:12}} ch={<><Lbl t="排水量シナリオ"/><RateBar val={rate} set={setRate}/><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginTop:14}}>{[{lbl:"人口（人）",v:pop,set:setPop,ph:"例：150"},{lbl:"貯留日数（日）",v:days,set:setDays,ph:"3"}].map(f=><div key={f.lbl}><div style={{fontSize:11,fontFamily:F,color:C.gray,marginBottom:5}}>{f.lbl}</div><input type="number" value={f.v} onChange={e=>f.set(e.target.value)} placeholder={f.ph} style={{width:"100%",boxSizing:"border-box",border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 12px",fontSize:14,fontFamily:F,color:C.deepBlue,outline:"none",background:C.offWhite}}/></div>)}</div>{tot&&cfg&&<><div style={{background:C.paleBlue,borderRadius:8,padding:"12px 16px",margin:"14px 0 10px",display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{fontSize:11,fontFamily:F,color:C.darkNavy}}>必要総容量</div><div style={{fontSize:10,fontFamily:F,color:C.gray}}>{pop}人 × {rate}L × {days}日</div></div><span style={{fontSize:24,fontFamily:FF,fontWeight:800,color:C.primaryBlue}}>{tot.toLocaleString()}L</span></div><div style={{display:"flex",gap:10,flexWrap:"wrap"}}>{cfg.map((b,i)=><div key={i} style={{background:C.white,border:`2px solid ${C.primaryBlue}`,borderRadius:10,padding:"10px 18px",textAlign:"center",minWidth:90}}><div style={{fontSize:22,fontFamily:FF,fontWeight:800,color:C.primaryBlue}}>{b.count}基</div><div style={{fontSize:12,fontFamily:F,color:C.deepBlue}}>{b.size.toLocaleString()}L</div>{b.surplus>0&&<div style={{fontSize:9,fontFamily:F,color:C.gray}}>+{b.surplus.toLocaleString()}L余剰</div>}</div>)}</div><div style={{fontSize:11,fontFamily:F,color:C.gray,marginTop:8}}>※ 1基ずつ順番使用。最大30,000L。</div></>}</>}/></div>);
}

  // confirm = { type:"switch", nextId, label } | { type:"dispose", bladId, label }

  if(confirm){
    const isSwitch=confirm.type==="switch";
    return(<Modal ch={<div>
      <div style={{fontSize:28,textAlign:"center",marginBottom:10}}>{isSwitch?"🔁":"🚛"}</div>

      <div style={{fontSize:12,fontFamily:F,color:C.gray,textAlign:"center",marginBottom:18}}>{isSwitch?"この操作は元に戻せません。物理的な接続切替を先に行ってください。":"処分記録は後から取り消せます。"}</div>

          onClose();
        }} style={{flex:1,padding:"11px 0",borderRadius:9,border:"none",background:isSwitch?C.primaryBlue:C.warn90,color:C.white,fontFamily:F,fontWeight:700,fontSize:14,cursor:"pointer"}}>
          実行する
        </button>
        <button onClick={()=>setConfirm(null)} style={{padding:"11px 16px",borderRadius:9,border:`1px solid ${C.border}`,background:"none",color:C.gray,fontFamily:F,fontSize:13,cursor:"pointer"}}>
          戻る
        </button>
      </div>
    </div>} onClose={()=>setConfirm(null)}/>);
  }

  return(<Modal ch={<div>
    <div style={{fontFamily:FF,fontWeight:800,fontSize:16,color:C.deepBlue,marginBottom:2}}>{site.name}</div>
    <div style={{fontSize:12,fontFamily:F,color:C.gray,marginBottom:14}}>緊急対応パネル</div>
    {a&&<div style={{background:p2>=90?"#FEF2F2":C.paleBlue,borderRadius:8,padding:"10px 14px",marginBottom:14}}>
      <FillBar p={p2} h={8} marks={true}/>
      <div style={{fontSize:12,fontFamily:F,color:p2>=90?C.warn90:C.deepBlue,marginTop:4,fontWeight:700}}>{p2}% · {a.fill.toLocaleString()}L / {a.cap.toLocaleString()}L</div>
    </div>}
    <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
      {sb.length>0&&<button
        onClick={()=>setConfirm({type:"switch",nextId:sb[0].id,label:`🔁 ブラダーを切替 → ${sb[0].id}（${sb[0].cap.toLocaleString()}L）`})}
        style={{padding:"10px 14px",borderRadius:9,border:`2px solid ${C.primaryBlue}`,background:C.paleBlue,color:C.primaryBlue,fontFamily:F,fontWeight:700,fontSize:13,cursor:"pointer",textAlign:"left"}}>
        🔁 ブラダーを切替 → {sb[0].id}（{sb[0].cap.toLocaleString()}L）
      </button>}
      {fb.filter(b=>!b.disposal).map(b=><button key={b.id}
        onClick={()=>setConfirm({type:"dispose",bladId:b.id,label:`🚛 ${b.id} を処分記録（バキューム車）`})}
        style={{padding:"10px 14px",borderRadius:9,border:`2px solid ${C.warn90}`,background:"#FEF2F2",color:C.warn90,fontFamily:F,fontWeight:700,fontSize:13,cursor:"pointer",textAlign:"left"}}>
        🚛 {b.id} を処分記録（バキューム車）
      </button>)}
      <button onClick={onTransfer} style={{padding:"10px 14px",borderRadius:9,border:`1px solid ${C.border}`,background:C.white,color:C.deepBlue,fontFamily:F,fontWeight:600,fontSize:13,cursor:"pointer",textAlign:"left"}}>🔄 ブラダー移送を申請する</button>
      <button onClick={()=>onDetail(site.id)} style={{padding:"10px 14px",borderRadius:9,border:`1px solid ${C.border}`,background:C.white,color:C.deepBlue,fontFamily:F,fontWeight:600,fontSize:13,cursor:"pointer",textAlign:"left"}}>📊 詳細ページを開く</button>

// ── CITY VIEW ─────────────────────────────────────────────
function CityView({sites,onLogout}){
  const [tab,setTab]=useState("map");
  const [selId,setSelId]=useState(null);
  const [rate,setRate]=useState(20);
  const [transfers,setTransfers]=useState(INIT_TRANSFERS);
  const [showTForm,setShowTForm]=useState(false);
  const [manSec,setManSec]=useState(null);
  const [quickSite,setQuickSite]=useState(null);

  const [siteData,setSiteData]=useState(()=>Object.fromEntries(sites.map(s=>[s.id,{
    bladders:s.bladders.map(b=>({...b,disposal:null})),
    sys:{...s.sys},
  }])));

  function getBl(id){return siteData[id]?.bladders||[];}
  function getSys(id){return siteData[id]?.sys||{};}
  function toggleSys(id,k){setSiteData(p=>({...p,[id]:{...p[id],sys:{...p[id].sys,[k]:!p[id].sys[k]}}}));}
  function doSwitch(id,nextId){setSiteData(p=>{const bl=[...p[id].bladders];const ai=bl.findIndex(b=>b.st==="active");const si=bl.findIndex(b=>b.id===nextId);if(ai>=0)bl[ai]={...bl[ai],st:"full",fill:bl[ai].cap};if(si>=0)bl[si]={...bl[si],st:"active"};return{...p,[id]:{...p[id],bladders:bl}};});}
  function doDispose(id,bladId,method,note){setSiteData(p=>({...p,[id]:{...p[id],bladders:p[id].bladders.map(b=>b.id===bladId?{...b,disposal:{method,time:nowStr(),note}}:b)}}));}
  function undoDispose(id,bladId){setSiteData(p=>({...p,[id]:{...p[id],bladders:p[id].bladders.map(b=>b.id===bladId?{...b,disposal:null}:b)}}));}
  function addBl(id,cap,label){setSiteData(p=>({...p,[id]:{...p[id],bladders:[...p[id].bladders,{id:label,cap,fill:0,st:"standby",disposal:null}]}}));}

  if(manSec) return(<div style={{minHeight:"100vh",background:C.offWhite}}><TopBar onLogo={onLogout} right={<BackBtn onClick={()=>setManSec(null)} label="マニュアルに戻る"/>}/><div style={{maxWidth:680,margin:"0 auto",padding:"24px 20px"}}><div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}><div style={{fontSize:28}}>{manSec.icon}</div><div><h2 style={{margin:0,fontFamily:FF,fontWeight:800,fontSize:20,color:C.deepBlue}}>{manSec.title}</h2><div style={{fontSize:12,fontFamily:F,color:C.gray}}>{manSec.sub}</div></div></div><div style={{background:C.paleBlue,border:`2px dashed ${C.lightBlue}`,borderRadius:12,padding:28,marginBottom:20,textAlign:"center"}}><div style={{fontSize:28,marginBottom:6}}>📐</div><div style={{fontFamily:FF,fontWeight:700,fontSize:14,color:C.darkNavy,marginBottom:3}}>{manSec.diag}</div><div style={{fontSize:11,fontFamily:F,color:C.gray}}>図面が完成次第、ここに挿入されます</div></div><Card ch={manSec.steps.map((s,i)=><div key={s.n} style={{display:"flex",gap:14,paddingBottom:i<manSec.steps.length-1?14:0,marginBottom:i<manSec.steps.length-1?14:0,borderBottom:i<manSec.steps.length-1?`1px solid ${C.border}`:"none"}}><div style={{width:28,height:28,borderRadius:"50%",background:C.primaryBlue,color:C.white,fontFamily:FF,fontWeight:800,fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{s.n}</div><div><div style={{fontFamily:FF,fontWeight:700,fontSize:13,color:C.deepBlue,marginBottom:2}}>{s.t}</div><div style={{fontSize:12,fontFamily:F,color:C.gray,lineHeight:1.6}}>{s.d}</div></div></div>)}/></div></div>);

  if(selId){
    const site=sites.find(s=>s.id===selId);
    const bl=getBl(selId); const sys=getSys(selId);
    return(<div style={{minHeight:"100vh",background:C.offWhite}}>
      <TopBar onLogo={onLogout} right={<BackBtn onClick={()=>setSelId(null)} label="一覧に戻る"/>}/>
      <div style={{maxWidth:860,margin:"0 auto",padding:"24px 24px"}}>
        <SiteDetail site={site} bladders={bl} sys={sys} rate={rate} setRate={setRate}
          onToggleSys={k=>toggleSys(selId,k)}
          onSwitch={nextId=>doSwitch(selId,nextId)}
          onDispose={(bladId,method,note)=>doDispose(selId,bladId,method,note)}
          onUndo={bladId=>undoDispose(selId,bladId)}
          onAdd={(cap,id)=>addBl(selId,cap,id)}
          onBack={()=>setSelId(null)}/>
        <Footer onLogout={onLogout}/>
      </div>
    </div>);
  }

  const disasterSites=sites.filter(s=>s.mode==="disaster");
  const normalSites=sites.filter(s=>s.mode==="normal");
  const totalSpare=sites.reduce((s,x)=>s+spareCap(getBl(x.id)),0);
  const pending=transfers.filter(t=>t.status==="pending").length;
  const critical=sites.filter(s=>{const bl=getBl(s.id);return alertLvl(bl,s.pop,rate)===2;}).length;

  return(<div style={{minHeight:"100vh",background:C.offWhite}}>
    <TopBar onLogo={onLogout} right={critical>0?<div style={{background:C.warn90,borderRadius:20,padding:"4px 14px",fontSize:12,fontFamily:F,color:C.white,fontWeight:700}}>⛔ {critical}件 要対応</div>:null}/>
    <div style={{maxWidth:960,margin:"0 auto",padding:"24px 24px"}}>
      {/* Stats */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:18}}>
        {[{v:sites.length,l:"管理サイト",col:C.deepBlue},{v:disasterSites.length,l:"災害対応中",col:disasterSites.length>0?C.warn90:C.deepBlue},{v:`${totalSpare.toLocaleString()}L`,l:"待機在庫合計",col:C.primaryBlue},{v:pending,l:"移送（承認待ち）",col:pending>0?C.warn70:C.success}].map(x=><div key={x.l} style={{background:C.white,border:`1px solid ${C.border}`,borderRadius:10,padding:"14px 16px"}}><div style={{fontSize:22,fontFamily:FF,fontWeight:800,color:x.col}}>{x.v}</div><div style={{fontSize:11,fontFamily:F,color:C.gray,marginTop:2}}>{x.l}</div></div>)}
      </div>
      <Card style={{marginBottom:16}} ch={<RateBar val={rate} set={setRate}/>}/>
      {/* Alerts */}
      {sites.filter(s=>alertLvl(getBl(s.id),s.pop,rate)===2).map(s=><div key={s.id} style={{background:"#FEF2F2",border:`2px solid ${C.warn90}`,borderLeft:`5px solid ${C.warn90}`,borderRadius:10,padding:"12px 16px",marginBottom:8,display:"flex",alignItems:"center",gap:14}}><div style={{flex:1}}><div style={{fontFamily:FF,fontWeight:700,fontSize:14,color:C.warn90}}>{s.name}</div><div style={{fontSize:12,fontFamily:F,color:"#B91C1C",marginTop:1}}>使用中ブラダー残り1日未満 · 至急対応が必要</div></div><button onClick={()=>setQuickSite(s)} style={{padding:"7px 14px",borderRadius:8,border:"none",background:C.warn90,color:C.white,fontFamily:F,fontWeight:700,fontSize:12,cursor:"pointer",whiteSpace:"nowrap"}}>今すぐ対応 →</button></div>)}
      {sites.filter(s=>alertLvl(getBl(s.id),s.pop,rate)===1).map(s=><div key={s.id} style={{background:"#FFFBEB",border:`2px solid ${C.warn70}`,borderLeft:`5px solid ${C.warn70}`,borderRadius:10,padding:"10px 16px",marginBottom:8,display:"flex",alignItems:"center",gap:14}}><div style={{flex:1}}><div style={{fontFamily:FF,fontWeight:700,fontSize:13,color:"#92400E"}}>{s.name}</div><div style={{fontSize:11,fontFamily:F,color:"#B45309"}}>使用中 {pct(activeB(getBl(s.id)))}%{(()=>{const d=daysLeft(getBl(s.id),s.pop,rate);return d!==null&&d<2?` · 残約${d}日`:""})()}  — バキューム車予約・次ブラダー確認を推奨</div></div><button onClick={()=>setSelId(s.id)} style={{padding:"6px 12px",borderRadius:8,border:`1px solid ${C.warn70}`,background:"transparent",color:"#92400E",fontFamily:F,fontWeight:700,fontSize:12,cursor:"pointer"}}>詳細 →</button></div>)}
      {/* Tabs */}
      <div style={{display:"flex",background:C.white,border:`1px solid ${C.border}`,borderRadius:10,padding:4,marginBottom:20}}>
        {[["map","マップ"],["sites","サイト一覧"],["transfers",`移送${pending>0?` (${pending})`:""}`],["more","︙"]].map(([k,l])=><button key={k} onClick={()=>setTab(k)} style={{flex:1,padding:"8px 0",border:"none",borderRadius:8,cursor:"pointer",fontFamily:F,fontSize:13,fontWeight:tab===k?700:400,background:tab===k?C.primaryBlue:"transparent",color:tab===k?C.white:C.gray,transition:"all .15s"}}>{l}</button>)}
      </div>
      {tab==="map"&&<MapView siteData={siteData} sites={sites} rate={rate} onSelect={setSelId}/>}
      {tab==="sites"&&<>
        {disasterSites.length>0&&<><div style={{fontSize:11,fontFamily:F,fontWeight:700,color:C.warn90,letterSpacing:1,textTransform:"uppercase",marginBottom:10}}>⚠ 災害対応中</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:22}}>{disasterSites.map(site=>{const bl=getBl(site.id);const a=activeB(bl);const p2=pct(a);const spare=spareCap(bl);const d=daysLeft(bl,site.pop,rate);return(<div key={site.id} onClick={()=>setSelId(site.id)} style={{background:C.white,border:`1px solid ${C.border}`,borderTop:`3px solid ${C.primaryBlue}`,borderRadius:10,padding:16,cursor:"pointer"}} onMouseEnter={e=>{e.currentTarget.style.boxShadow="0 4px 16px rgba(29,78,216,.1)";}} onMouseLeave={e=>{e.currentTarget.style.boxShadow="none";}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}><div><div style={{fontFamily:FF,fontWeight:700,fontSize:14,color:C.deepBlue}}>{site.name}</div><div style={{fontSize:11,fontFamily:F,color:C.gray}}>{site.loc} · {site.pop}人</div></div><div style={{textAlign:"right"}}><div style={{fontSize:14,fontFamily:FF,fontWeight:800,color:spare>0?C.primaryBlue:C.warn90}}>{spare>0?`${spare.toLocaleString()}L`:"在庫なし"}</div><div style={{fontSize:10,fontFamily:F,color:C.gray}}>待機在庫</div></div></div>{a&&<><FillBar p={p2} h={7} marks={true}/><div style={{display:"flex",justifyContent:"space-between",marginTop:4}}><span style={{fontSize:11,fontFamily:F,color:C.gray}}>{p2}%</span><span style={{fontSize:11,fontFamily:F,color:d===-1?C.warn90:C.gray}}>残{d===-1?"<1":d}日</span></div></>}</div>);})}</div></>}
        {normalSites.length>0&&<><div style={{fontSize:11,fontFamily:F,fontWeight:700,color:C.success,letterSpacing:1,textTransform:"uppercase",marginBottom:10}}>✓ 通常運転</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>{normalSites.map(site=><div key={site.id} onClick={()=>setSelId(site.id)} style={{background:C.white,border:`1px solid ${C.border}`,borderTop:`3px solid ${C.success}`,borderRadius:10,padding:16,cursor:"pointer"}} onMouseEnter={e=>{e.currentTarget.style.boxShadow="0 4px 16px rgba(16,185,129,.1)";}} onMouseLeave={e=>{e.currentTarget.style.boxShadow="none";}}><div style={{fontFamily:FF,fontWeight:700,fontSize:14,color:C.deepBlue,marginBottom:4}}>{site.name}</div><div style={{fontSize:11,fontFamily:F,color:C.gray,marginBottom:6}}>{site.loc} · {site.pop}人</div><div style={{fontSize:13,fontFamily:FF,fontWeight:700,color:C.success}}>待機 {spareCap(getBl(site.id)).toLocaleString()}L</div></div>)}</div></>}
      </>}
      {tab==="transfers"&&<>{showTForm?<TransferForm sites={sites} onSubmit={d=>{setTransfers(p=>[...p,{id:Date.now(),from:d.from,to:d.to,size:d.size,count:d.count,status:"pending",at:"今",note:d.note}]);setShowTForm(false);}} onCancel={()=>setShowTForm(false)}/>:<button onClick={()=>setShowTForm(true)} style={{display:"block",width:"100%",padding:"10px 0",borderRadius:8,border:`2px dashed ${C.primaryBlue}`,background:C.paleBlue,color:C.primaryBlue,fontFamily:F,fontWeight:700,fontSize:13,cursor:"pointer",marginBottom:16}}>+ 移送申請を作成</button>}{!showTForm&&<TransferList transfers={transfers} sites={sites} isCity={true} onAction={(id,st)=>setTransfers(p=>p.map(t=>t.id===id?{...t,status:st}:t))}/>}</>}
      {tab==="more"&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>{[{icon:"🚛",t:"バキューム車",s:"契約・連絡先",k:"vacuum"},{icon:"📐",t:"容量計算",s:"推奨サイズ",k:"recommender"},{icon:"📖",t:"マニュアル",s:"接続・操作手順",k:"manual_grid"}].map(x=><button key={x.k} onClick={()=>setTab(x.k)} style={{background:C.white,border:`1px solid ${C.border}`,borderRadius:12,padding:"18px 16px",cursor:"pointer",textAlign:"left"}} onMouseEnter={e=>{e.currentTarget.style.boxShadow="0 4px 16px rgba(29,78,216,.1)";e.currentTarget.style.borderColor=C.primaryBlue;}} onMouseLeave={e=>{e.currentTarget.style.boxShadow="none";e.currentTarget.style.borderColor=C.border;}}><div style={{fontSize:26,marginBottom:8}}>{x.icon}</div><div style={{fontFamily:FF,fontWeight:700,fontSize:15,color:C.deepBlue,marginBottom:3}}>{x.t}</div><div style={{fontSize:12,fontFamily:F,color:C.gray}}>{x.s}</div></button>)}</div>}
      {tab==="vacuum"&&<><button onClick={()=>setTab("more")} style={{background:"none",border:"none",color:C.primaryBlue,cursor:"pointer",fontSize:13,fontFamily:F,padding:"0 0 14px",display:"flex",alignItems:"center",gap:5}}>← メニュー</button><VacuumPanel/></>}
      {tab==="recommender"&&<><button onClick={()=>setTab("more")} style={{background:"none",border:"none",color:C.primaryBlue,cursor:"pointer",fontSize:13,fontFamily:F,padding:"0 0 14px",display:"flex",alignItems:"center",gap:5}}>← メニュー</button><Recommender/></>}
      {tab==="manual_grid"&&<><button onClick={()=>setTab("more")} style={{background:"none",border:"none",color:C.primaryBlue,cursor:"pointer",fontSize:13,fontFamily:F,padding:"0 0 14px",display:"flex",alignItems:"center",gap:5}}>← メニュー</button><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>{MANUAL.map(s=><div key={s.id} onClick={()=>setManSec(s)} style={{background:C.white,border:`1px solid ${C.border}`,borderTop:`3px solid ${C.primaryBlue}`,borderRadius:10,padding:18,cursor:"pointer"}} onMouseEnter={e=>{e.currentTarget.style.boxShadow="0 4px 16px rgba(29,78,216,.1)";}} onMouseLeave={e=>{e.currentTarget.style.boxShadow="none";}}><div style={{fontSize:24,marginBottom:8}}>{s.icon}</div><div style={{fontFamily:FF,fontWeight:700,fontSize:14,color:C.deepBlue,marginBottom:2}}>{s.title}</div><div style={{fontSize:11,fontFamily:F,color:C.gray}}>{s.steps.length}ステップ →</div></div>)}</div></>}
      <Footer onLogout={onLogout}/>
    </div>
    {/* Quick action modal */}
    {quickSite&&<QuickActionModal site={quickSite} bl={getBl(quickSite.id)} onSwitch={doSwitch} onDispose={doDispose} onClose={()=>setQuickSite(null)} onTransfer={()=>{setQuickSite(null);setTimeout(()=>{setTab("transfers");setShowTForm(true);},50);}} onDetail={id=>{setSelId(id);setQuickSite(null);}}/>}
  </div>);
}

// ── LOGIN ─────────────────────────────────────────────────
function Login({onLogin}){
  const [tab,setTab]=useState("building");
  const [pin,setPin]=useState(""); const [user,setUser]=useState(""); const [pass,setPass]=useState("");
  const [err,setErr]=useState(""); const [loading,setLoading]=useState(false);
  function submit(){
    setErr(""); setLoading(true);
    setTimeout(()=>{
      setLoading(false);
      if(tab==="city"){
        if(user===CITY_CREDS.user&&pass===CITY_CREDS.pass) onLogin({role:"city"});
        else setErr("ユーザー名またはパスワードが正しくありません");
      } else {
        const siteId=PINS[pin];
        if(siteId) onLogin({role:"building",siteId});
        else setErr("PINコードが正しくありません");
      }
    },500);
  }
  const inp={width:"100%",boxSizing:"border-box",border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 14px",fontSize:15,fontFamily:F,color:C.deepBlue,background:C.white,outline:"none",marginBottom:12};
  return(<div style={{minHeight:"100vh",display:"flex",fontFamily:F}}>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@700;800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet"/>
    {/* Left brand */}
    <div style={{width:"42%",minHeight:"100vh",background:C.deepBlue,display:"flex",flexDirection:"column",justifyContent:"space-between",padding:"48px 40px",position:"relative",overflow:"hidden"}}>
      <div style={{position:"absolute",right:-80,top:"30%",width:300,height:300,borderRadius:"50%",border:`1px solid ${C.primaryBlue}33`,pointerEvents:"none"}}/>
      <div style={{position:"absolute",right:-30,top:"28%",width:180,height:180,borderRadius:"50%",border:`1px solid ${C.primaryBlue}55`,pointerEvents:"none"}}/>
      <div><Logo size={40} light/><div style={{fontFamily:FF,fontWeight:800,fontSize:36,color:C.white,letterSpacing:6,marginTop:16,lineHeight:1}}>SONAE</div><div style={{fontSize:14,color:C.lightBlue,marginTop:10,letterSpacing:2}}>暮らしを、止めない。</div></div>
      <div>
        <svg width="180" height="80" viewBox="0 0 180 80" fill="none" opacity="0.45">
          <rect x="2" y="20" width="50" height="40" rx="4" stroke="#93C5FD" strokeWidth="1.5" fill="none"/>
          <line x1="27" y1="2" x2="27" y2="20" stroke="#93C5FD" strokeWidth="1.5"/>
          <line x1="27" y1="60" x2="27" y2="78" stroke="#93C5FD" strokeWidth="1.5" strokeDasharray="4 2"/>
          <line x1="52" y1="40" x2="78" y2="40" stroke="#93C5FD" strokeWidth="1.5"/>
          <rect x="78" y="14" width="56" height="52" rx="4" stroke="#93C5FD" strokeWidth="1.5" fill="none"/>
          <circle cx="106" cy="40" r="16" stroke="#1D4ED8" strokeWidth="1.5"/>
          <circle cx="106" cy="40" r="6" fill="#93C5FD"/>
          <line x1="134" y1="40" x2="158" y2="40" stroke="#93C5FD" strokeWidth="1.5"/>
          <rect x="158" y="24" width="20" height="32" rx="3" stroke="#93C5FD" strokeWidth="1.5" fill="#1D4ED855"/>
        </svg>
        <div style={{fontSize:11,color:`${C.lightBlue}88`,lineHeight:1.8,marginTop:8}}>災害時排水切替システム<br/>管理・監視プラットフォーム<br/>Nara Construction Co., Ltd.</div>
      </div>
    </div>
    {/* Right login */}
    <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",background:C.offWhite,padding:"40px 32px"}}>
      <div style={{width:"100%",maxWidth:360}}>
        <div style={{fontFamily:FF,fontWeight:800,fontSize:24,color:C.deepBlue,marginBottom:6}}>ログイン</div>
        <div style={{fontSize:13,fontFamily:F,color:C.gray,marginBottom:24}}>アカウント種別を選択してください</div>
        <div style={{display:"flex",background:C.white,border:`1px solid ${C.border}`,borderRadius:10,padding:4,marginBottom:22}}>
          {[{k:"building",l:"建物管理者"},{k:"city",l:"行政・広域管理者"}].map(r=><button key={r.k} onClick={()=>{setTab(r.k);setErr("");setPin("");setUser("");setPass("");}} style={{flex:1,padding:"9px 0",borderRadius:8,border:"none",cursor:"pointer",fontFamily:F,fontSize:13,fontWeight:tab===r.k?700:400,background:tab===r.k?C.primaryBlue:"transparent",color:tab===r.k?C.white:C.gray,transition:"all .15s"}}>{r.l}</button>)}
        </div>
        {tab==="building"?<>
          <div style={{fontSize:12,fontFamily:F,color:C.gray,marginBottom:8}}>施設PINコード</div>
          <input type="password" value={pin} onChange={e=>setPin(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="••••" maxLength={6} style={{...inp,letterSpacing:8,fontSize:22,textAlign:"center"}} onFocus={e=>e.target.style.borderColor=C.primaryBlue} onBlur={e=>e.target.style.borderColor=C.border}/>
          <div style={{fontSize:11,fontFamily:F,color:C.gray,marginBottom:20,textAlign:"center"}}>デモ用PIN: <span style={{fontFamily:"DM Mono,monospace",color:C.primaryBlue}}>1001</span> · <span style={{fontFamily:"DM Mono,monospace",color:C.primaryBlue}}>2002</span> · <span style={{fontFamily:"DM Mono,monospace",color:C.primaryBlue}}>3003</span></div>
        </>:<>
          <div style={{fontSize:12,fontFamily:F,color:C.gray,marginBottom:8}}>ユーザー名</div>
          <input value={user} onChange={e=>setUser(e.target.value)} placeholder="admin" style={inp} onFocus={e=>e.target.style.borderColor=C.primaryBlue} onBlur={e=>e.target.style.borderColor=C.border}/>
          <div style={{fontSize:12,fontFamily:F,color:C.gray,marginBottom:8}}>パスワード</div>
          <input type="password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="••••••••" style={inp} onFocus={e=>e.target.style.borderColor=C.primaryBlue} onBlur={e=>e.target.style.borderColor=C.border}/>
          <div style={{fontSize:11,fontFamily:F,color:C.gray,marginBottom:20}}>デモ: <span style={{fontFamily:"DM Mono,monospace",color:C.primaryBlue}}>admin</span> / <span style={{fontFamily:"DM Mono,monospace",color:C.primaryBlue}}>sonae2026</span></div>
        </>}
        {err&&<div style={{background:"#FEF2F2",border:`1px solid ${C.warn90}`,borderRadius:8,padding:"9px 14px",fontSize:13,fontFamily:F,color:C.warn90,marginBottom:14}}>⚠ {err}</div>}
        <button onClick={submit} disabled={loading} style={{width:"100%",padding:"13px 0",borderRadius:10,border:"none",background:loading?"#9CA3AF":C.primaryBlue,color:C.white,fontFamily:FF,fontWeight:800,fontSize:16,cursor:loading?"not-allowed":"pointer"}}>
          {loading?"確認中...":"ログイン →"}
        </button>
      </div>
    </div>
  </div>);
}

// ── ROOT ──────────────────────────────────────────────────
function App(){
  const [session,setSession]=useState(null);
  if(!session) return <Login onLogin={s=>setSession(s)}/>;
  const site=SITES_INIT.find(s=>s.id===session.siteId)||SITES_INIT[0];
  if(session.role==="building") return <BuildingView site={site} onLogout={()=>setSession(null)}/>;
  return <CityView sites={SITES_INIT} onLogout={()=>setSession(null)}/>;
}


    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
